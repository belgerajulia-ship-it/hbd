<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Happy 27th Birthday — A Love Surprise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Background layer with subtle texture, stars, sparkles -->
    <div id="bg-stars" aria-hidden="true"></div>

    <!-- Global canvas for particles (confetti, petals, hearts, sparkles) -->
    <canvas id="particles-canvas"></canvas>

    <!-- Music toggle -->
    <button id="musicToggle" class="control-btn" aria-pressed="false">🔊 Music</button>

    <!-- Stage containers -->
    <main id="stages">
      <!-- Stage 1: Surprise with cake and friends -->
      <section id="stage-1" class="stage active" data-stage="1" aria-hidden="false">
        <div class="scene">
          <h1 class="large-bounce-title" id="birthdayTitle">HAPPY BIRTHDAY!</h1>

          <div id="friends-area" class="friends-area" aria-hidden="false"></div>

          <div id="puppy-wrap" class="puppy-wrap">
            <!-- Cake held by puppy -->
            <div class="puppy">
              <div class="ears ear-left"></div>
              <div class="ears ear-right"></div>
              <div class="head">
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="blush left"></div>
                <div class="blush right"></div>
                <div class="mouth">w</div>
              </div>
              <div class="body">
                <div class="tail"></div>
                <div class="leg left"></div>
                <div class="leg right"></div>
                <div class="cake-stage1">
                  <div class="cake-top"></div>
                  <div class="cake-candles">
                    <div class="candle small"></div>
                    <div class="candle small"></div>
                    <div class="candle small"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <button id="continueBtn" class="cta">Continue the surprise →</button>
        </div>
      </section>

      <!-- Stage 2: Heart cake and blow-out -->
      <section id="stage-2" class="stage" data-stage="2" aria-hidden="true">
        <div class="scene">
          <div class="center-stage">
            <div class="heart-cake" id="heartCake" role="img" aria-label="heart shaped cake">
              <div class="cake-number">27</div>
              <div class="flame flame-2" id="flame2"></div>
              <div class="flame flame-7" id="flame7"></div>
            </div>
            <p class="prompt">Make a wish, my love...</p>

            <div class="blow-controls">
              <button id="blowBtn" class="cta">🎙 Blow out the candles</button>
              <div id="mic-status" class="mic-status">Microphone: <span id="micState">idle</span></div>
            </div>

            <p id="wishMade" class="wish-made hidden">Your wish has been made. ✨</p>

            <button id="continueTo3Btn" class="cta hidden">Continue →</button>
          </div>
        </div>
      </section>

      <!-- Stage 3: Singing performance -->
      <section id="stage-3" class="stage" data-stage="3" aria-hidden="true">
        <div class="scene stage3">
          <div class="spotlight"></div>
          <div id="friends-area-3" class="friends-area stage3-friends"></div>

          <div class="puppy-wrap center-stage singing">
            <div class="puppy singing-puppy">
              <div class="ears ear-left"></div>
              <div class="ears ear-right"></div>
              <div class="head">
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="blush left"></div>
                <div class="blush right"></div>
                <div class="mouth">w</div>
              </div>
              <div class="body">
                <div class="tail"></div>
                <div class="leg left"></div>
                <div class="leg right"></div>
                <div class="mic" id="stage3Mic"></div>
              </div>
            </div>
          </div>

          <div class="lyrics">♪ Happy Birthday to You ♪</div>

          <div class="controls-row">
            <button id="pauseSongBtn" class="cta">Pause Visuals</button>
            <button id="continueTo4Btn" class="cta">Next →</button>
          </div>
        </div>
      </section>

      <!-- Stage 4: Walk with bouquet and kiss -->
      <section id="stage-4" class="stage" data-stage="4" aria-hidden="true">
        <div class="scene">
          <div class="approach-stage" id="approachStage">
            <div class="puppy far" id="puppyApproach">
              <div class="ears ear-left"></div>
              <div class="ears ear-right"></div>
              <div class="head">
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="blush left"></div>
                <div class="blush right"></div>
                <div class="mouth">w</div>
              </div>
              <div class="body">
                <div class="tail"></div>
                <div class="leg left"></div>
                <div class="leg right"></div>
                <div class="bouquet" id="bouquet">
                  <div class="roses"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="controls-row">
            <button id="readMessageBtn" class="cta hidden">Read my birthday message →</button>
          </div>

          <div id="forYouText" class="for-you-text hidden">For you, my love... ❤️</div>
        </div>
      </section>

      <!-- Stage 5: Romantic final message -->
      <section id="stage-5" class="stage" data-stage="5" aria-hidden="true">
        <div class="scene final-scene">
          <div class="romantic-overlay"></div>
          <div class="final-content">
            <div id="finalMessage" class="final-message"></div>
            <button id="replayBtn" class="cta">↻ Replay the Magic</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
