<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Happy 27th Birthday — A Surprise</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Accessible app wrapper -->
  <div id="app" class="app" aria-live="polite">
    <!-- Fixed Music Control (corner) -->
    <button id="musicToggle" class="music-toggle" aria-pressed="false" aria-label="Music toggle">
      <span id="musicIcon">🔈</span> <span class="visually-hidden">Music</span>
    </button>

    <!-- Stage containers (full-screen each) -->
    <main id="stages" class="stages">

      <!-- STAGE 1 — BIRTHDAY SURPRISE -->
      <section id="stage1" class="stage active" data-stage="1" aria-label="Birthday surprise">
        <div class="sky-bg">
          <canvas id="stage1-sparkles" class="sparkles-canvas" aria-hidden="true"></canvas>
          <div class="floating-stars" aria-hidden="true"></div>
        </div>

        <div class="stage-inner">
          <!-- Back row of 10 friends -->
          <div class="friends friends-10" aria-hidden="true" id="friends-stage1">
            <!-- 10 friend markup (varied via CSS nth-child styles) -->
            <!-- Each friend has .friend .face .eyes .mouth .hands .gift to animate -->
            <div class="friend f1"><div class="face"><div class="eyes"></div><div class="mouth"></div></div><div class="hands"></div><div class="gift"></div></div>
            <div class="friend f2"><div class="face"><div class="eyes"></div><div class="mouth"></div></div><div class="hands"></div><div class="gift"></div></div>
            <div class="friend f3"><div class="face"><div class="eyes"></div><div class="mouth"></div></div><div class="hands"></div><div class="gift"></div></div>
            <div class="friend f4"><div class="face"><div class="eyes"></div><div class="mouth"></div></div><div class="hands"></div><div class="gift"></div></div>
            <div class="friend f5"><div class="face"><div class="eyes"></div><div class="mouth"></div></div><div class="hands"></div><div class="gift"></div></div>
            <div class="friend f6"><div class="face"><div class="eyes"></div><div class="mouth"></div></div><div class="hands"></div><div class="gift"></div></div>
            <div class="friend f7"><div class="face"><div class="eyes"></div><div class="mouth"></div></div><div class="hands"></div><div class="gift"></div></div>
            <div class="friend f8"><div class="face"><div class="eyes"></div><div class="mouth"></div></div><div class="hands"></div><div class="gift"></div></div>
            <div class="friend f9"><div class="face"><div class="eyes"></div><div class="mouth"></div></div><div class="hands"></div><div class="gift"></div></div>
            <div class="friend f10"><div class="face"><div class="eyes"></div><div class="mouth"></div></div><div class="hands"></div><div class="gift"></div></div>
          </div>

          <!-- Main Character (Cinnamon Roll-inspired puppy) -->
          <div id="hero" class="hero" role="img" aria-label="Birthday puppy holding a cake">
            <div class="puppy">
              <div class="ears left"></div>
              <div class="ears right"></div>
              <div class="head">
                <div class="face">
                  <div class="eyes left-eye"><span class="sparkle"></span></div>
                  <div class="eyes right-eye"><span class="sparkle"></span></div>
                  <div class="blush left-blush"></div>
                  <div class="blush right-blush"></div>
                  <div class="mouth">w</div>
                </div>
                <div class="tail"></div>
              </div>
              <div class="body">
                <div class="belly"></div>
                <div class="legs">
                  <div class="leg"></div>
                  <div class="leg"></div>
                </div>
                <div class="cake" aria-hidden="true">
                  <div class="cake-top"></div>
                  <div class="cake-body"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Celebration overlays -->
          <div id="confetti1" class="confetti" aria-hidden="true"></div>
          <div id="sparkles1" class="sparkles" aria-hidden="true"></div>

          <!-- Large greeting text -->
          <div id="greeting" class="greeting" aria-hidden="true">HAPPY BIRTHDAY!</div>

          <!-- Continue Button -->
          <div class="controls">
            <button id="toStage2" class="btn btn-primary" aria-label="Continue to make a wish">Continue the surprise →</button>
          </div>
        </div>
      </section>

      <!-- STAGE 2 — MAKE A WISH -->
      <section id="stage2" class="stage" data-stage="2" aria-label="Make a wish" hidden>
        <div class="sky-bg subtle">
          <canvas id="stage2-sparkles" class="sparkles-canvas" aria-hidden="true"></canvas>
        </div>

        <div class="stage-inner center">
          <div class="scene-card">
            <div class="cake-scene" id="cakeScene" role="img" aria-label="Heart shaped cake with number 27">
              <!-- Heart-shaped cake created with CSS shapes -->
              <div class="heart-cake" id="heartCake">
                <div class="cake-number" aria-hidden="true">
                  <div class="num num2">2<span class="flame" data-flame="2"></span></div>
                  <div class="num num7">7<span class="flame" data-flame="7"></span></div>
                </div>
                <div class="cake-decoration"></div>
              </div>
            </div>

            <div class="wish-text" id="wishText" aria-live="polite">Make a wish, my love...</div>

            <div class="controls">
              <button id="micButton" class="btn btn-primary" aria-pressed="false">🎙 Blow out the candles</button>
              <button id="tapBlow" class="btn btn-secondary" hidden>Tap to blow</button>
            </div>

            <div id="afterWish" class="after-wish" hidden aria-live="polite">
              <div class="wish-done">Your wish has been made. ✨</div>
              <button id="toStage3" class="btn btn-primary">Continue →</button>
            </div>
          </div>
        </div>
      </section>

      <!-- STAGE 3 — BIRTHDAY SONG -->
      <section id="stage3" class="stage" data-stage="3" aria-label="Birthday song" hidden>
        <div class="theater-bg">
          <canvas id="stage3-particles" class="sparkles-canvas" aria-hidden="true"></canvas>
          <div class="spotlight" aria-hidden="true"></div>
        </div>

        <div class="stage-inner center">
          <div class="stage-topline">♪ Happy Birthday to You ♪</div>

          <div class="stage-stage">
            <div class="puppy-stage" id="puppyStage" role="img" aria-label="Puppy singing">
              <!-- Reuse hero style but different posture -->
              <div class="puppy small">
                <div class="ears left"></div>
                <div class="ears right"></div>
                <div class="head">
                  <div class="face">
                    <div class="eyes left-eye"><span class="sparkle"></span></div>
                    <div class="eyes right-eye"><span class="sparkle"></span></div>
                    <div class="blush left-blush"></div>
                    <div class="blush right-blush"></div>
                    <div class="mouth">w</div>
                  </div>
                </div>
                <div class="body">
                  <div class="belly"></div>
                </div>
              </div>
              <div class="mic-stand"></div>
            </div>

            <div id="friends-stage3" class="friends friends-20" aria-hidden="true">
              <!-- 20 friends (repeated elements styled differently in CSS) -->
              <!-- We'll generate the rest via JS for variety too, but include some markup for accessibility -->
              <!-- Add 20 containers -->
              <div class="friend a1"></div><div class="friend a2"></div><div class="friend a3"></div><div class="friend a4"></div><div class="friend a5"></div>
              <div class="friend a6"></div><div class="friend a7"></div><div class="friend a8"></div><div class="friend a9"></div><div class="friend a10"></div>
              <div class="friend a11"></div><div class="friend a12"></div><div class="friend a13"></div><div class="friend a14"></div><div class="friend a15"></div>
              <div class="friend a16"></div><div class="friend a17"></div><div class="friend a18"></div><div class="friend a19"></div><div class="friend a20"></div>
            </div>

          </div>

          <div class="controls">
            <button id="toStage4" class="btn btn-primary">Continue →</button>
          </div>
        </div>
      </section>

      <!-- STAGE 4 — FLOWERS & KISS -->
      <section id="stage4" class="stage" data-stage="4" aria-label="Flowers and kiss" hidden>
        <div class="sky-bg romantic">
          <canvas id="stage4-hearts" class="sparkles-canvas" aria-hidden="true"></canvas>
        </div>

        <div class="stage-inner center">
          <div class="cinematic-scene">
            <div id="puppyWalk" class="puppy-walk" role="img" aria-label="Puppy walking with a bouquet">
              <div class="puppy medium">
                <div class="ears left"></div>
                <div class="ears right"></div>
                <div class="head">
                  <div class="face">
                    <div class="eyes left-eye"><span class="sparkle"></span></div>
                    <div class="eyes right-eye"><span class="sparkle"></span></div>
                    <div class="blush left-blush"></div>
                    <div class="blush right-blush"></div>
                    <div class="mouth">w</div>
                  </div>
                </div>
                <div class="body">
                  <div class="belly"></div>
                </div>
              </div>

              <div class="bouquet" id="bouquet" aria-hidden="true">
                <div class="roses"></div>
                <div class="wrap"></div>
              </div>
            </div>

            <div id="kissHeartOverlay" class="kiss-overlay" aria-hidden="true"></div>
            <div id="kissText" class="kiss-text" hidden>For you, my love... ❤️</div>

            <div class="controls">
              <button id="toStage5" class="btn btn-primary" hidden>Read my birthday message →</button>
            </div>
          </div>
        </div>
      </section>

      <!-- STAGE 5 — FINAL LOVE MESSAGE -->
      <section id="stage5" class="stage" data-stage="5" aria-label="Final love message" hidden>
        <div class="sky-bg final">
          <canvas id="stage5-petals" class="sparkles-canvas" aria-hidden="true"></canvas>
        </div>

        <div class="stage-inner center">
          <div class="final-card">
            <div id="finalDecor" class="final-decor" aria-hidden="true"></div>
            <div id="finalMessage" class="final-message" aria-live="polite">
              <!-- Hidden initially — JS will type in -->
            </div>

            <div class="controls">
              <button id="replay" class="btn btn-primary">↻ Replay the Magic</button>
            </div>
          </div>
        </div>
      </section>

    </main>

    <!-- Hidden audio element (local file birthday.mp3 if supplied) -->
    <audio id="bgAudio" preload="auto" src="birthday.mp3"></audio>
  </div>

  <script src="script.js"></script>
</body>
</html>
